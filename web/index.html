<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdad o mentira</title>
  <meta name="description" content="Juego de lógica: descubrí quién miente y quién es capaz de hacer las dos cosas.">
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <style>
    :root { --fondo: #14171c; --tinta: #e8eaee; --tinta-suave: #9aa3af; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #juego { position: fixed; inset: 0 0 28px 0; }
    #cargando { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px;
      text-align: center; pointer-events: none; transition: opacity .4s ease; }
    #cargando h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); }
    #cargando p { margin: 0; color: var(--tinta-suave); }
    .barra { width: 220px; height: 4px; margin: 8px auto 0; border-radius: 2px; overflow: hidden;
      background: #262b33; }
    .barra::after { content: ""; display: block; width: 40%; height: 100%; background: var(--tinta-suave);
      animation: avance 1.2s ease-in-out infinite; }
    @keyframes avance { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    footer { position: fixed; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; color: var(--tinta-suave); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="cargando">
    <h1>Verdad o mentira</h1>
    <p>Cargando el juego… la primera vez puede tardar unos segundos.</p>
    <div class="barra"></div>
  </div>
  <footer>Built with&nbsp;<a href="https://cheerpj.com/" target="_blank" rel="noopener">CheerpJ</a></footer>
  <script type="module">
    await cheerpjInit({ version: 21 });
    cheerpjCreateDisplay(-1, -1, document.getElementById("juego"));
    const cargando = document.getElementById("cargando");
    setTimeout(() => { cargando.style.opacity = "0"; }, 4000);
    await cheerpjRunJar("/app/verdad-o-mentira.jar");
  </script>
</body>
</html>
